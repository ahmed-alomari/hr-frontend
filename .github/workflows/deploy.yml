name: Build & Deploy Frontend to VPS

# =====================================================================
#  متى يشتغل هذا الملف (Trigger):
#  1) أي Push مباشر إلى برانش "main-prod-hamada" (إنتاج سيرفر Contabo — nazafa.qutb.tech)
#  2) عند دمج (merge) أي Pull Request من "main-dev-amar" داخل "main-prod-amar"
#     (دمج الـ PR في GitHub هو تقنيًا "push" إلى البرانش الهدف،
#      لذلك سطر "push -> branches: [main-prod-amar]" يغطي الحالتين معًا)
#
#  ينشر خدمة "web" وحدها على السيرفر، فلا يمسّ الباك اند إطلاقًا.
# =====================================================================

on:
  push:
    branches:
      - main-prod-hamada   # <-- غيّر اسم البرانش هنا إذا احتجت
  workflow_dispatch:      # تشغيل يدوي من تبويب Actions عند الحاجة

env:
  REGISTRY: ghcr.io
  # اسم الحزمة على GHCR. مستقل عن اسم الريبو عمدًا حتى لا يحمل بادئة hr-.
  IMAGE_BASENAME: frontend-hamada
  # مجلد ستاك المنصة على السيرفر (نفس مجلد الباك اند — ملف compose واحد).
  APP_DIR: /root/Desktop/qutb-platform
  # اسم الخدمة داخل docker-compose.yml التي يملكها هذا المستودع.
  SERVICE: web

  # ---- متغيرات تُخبز داخل الصورة وقت البناء ----
  # Next.js يجمّد كل NEXT_PUBLIC_* داخل حزمة المتصفح أثناء `next build`،
  # ويجمّد وجهة rewrites في routes-manifest. تغييرها يستلزم إعادة بناء.
  #
  # المتصفح ينادي /api-backend/* على نفس الأصل، وNext يمرّرها داخليًا
  # إلى BACKEND_URL عبر شبكة Docker — لا CORS ولا خروج إلى الإنترنت.
  NEXT_PUBLIC_API_URL: /api-backend
  BACKEND_URL: http://app:3000
  NEXT_PUBLIC_SITE_URL: https://nazafa.qutb.tech
  NEXT_PUBLIC_ENV: production
  # لا متجر على هذا النشر: nazafa.qutb.tech يفتح لوحة الإدارة مباشرة.
  NEXT_PUBLIC_STOREFRONT_COMPANY_ID: ''
  NEXT_PUBLIC_CONSOLE_HOSTS: nazafa.qutb.tech

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # مطلوب للسماح بالرفع إلى GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase) and short SHA
        id: vars
        run: |
          # أسماء صور Docker لا تقبل الأحرف الكبيرة، واسم المالك يحتوي عليها
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${owner}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # public.ecr.aws answers 429 when many GitHub runners pull the same
      # Node base image. Retry only that refusal; a real build error stops.
      - name: Build and push image
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA: ${{ steps.vars.outputs.sha_short }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_HERE_API_KEY: ${{ secrets.NEXT_PUBLIC_HERE_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID || secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
        run: |
          set -uo pipefail
          log=$(mktemp)
          build() {
            docker buildx build \
              --push \
              --provenance=false \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --build-arg NEXT_PUBLIC_API_URL \
              --build-arg BACKEND_URL \
              --build-arg NEXT_PUBLIC_SITE_URL \
              --build-arg NEXT_PUBLIC_ENV \
              --build-arg NEXT_PUBLIC_STOREFRONT_COMPANY_ID \
              --build-arg NEXT_PUBLIC_CONSOLE_HOSTS \
              --build-arg NEXT_PUBLIC_APP_NAME \
              --build-arg NEXT_PUBLIC_HERE_API_KEY \
              --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY \
              --build-arg NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID \
              -t "${IMAGE}:latest" \
              -t "${IMAGE}:${SHA}" \
              . 2>&1 | tee "$log"
          }
          attempt=1
          while true; do
            set +e
            build
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if ! grep -q '429 Too Many Requests' "$log" || [ "$attempt" -ge 4 ]; then
              exit "$code"
            fi
            wait=$((attempt * 40))
            echo "Base image registry returned 429. Waiting ${wait}s before attempt $((attempt + 1))..."
            sleep "$wait"
            attempt=$((attempt + 1))
          done

  deploy:
    name: Deploy on VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # يسمح لـ GITHUB_TOKEN بسحب الصورة الخاصة من GHCR

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HAMADA_VPS_HOST }}
          username: ${{ secrets.HAMADA_VPS_USER }}
          key: ${{ secrets.HAMADA_VPS_SSH_KEY }}
          port: ${{ secrets.HAMADA_VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            # سجّل دخول السيرفر إلى GHCR لسحب الصورة (الحزمة Private).
            # نستخدم GITHUB_TOKEN المؤقت الخاص بهذا التشغيل بدل PAT دائم:
            # صلاحيته تنتهي مع انتهاء الـ job، فلا يبقى سر طويل العمر على السيرفر.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            cd "${{ env.APP_DIR }}" || {
              echo "::error::مجلد النشر ${{ env.APP_DIR }} غير موجود على السيرفر"
              exit 1
            }

            # خدمة هذا المستودع وحدها — الباك اند لا يُعاد تشغيله
            docker compose pull ${{ env.SERVICE }}
            docker compose up -d ${{ env.SERVICE }}

            # انتظر جاهزية الواجهة
            for i in $(seq 1 40); do
              health=$(docker inspect -f '{{.State.Health.Status}}' frontend-web 2>/dev/null || echo starting)
              [ "$health" = "healthy" ] && break
              sleep 5
            done
            if [ "$health" != "healthy" ]; then
              echo "::error::الواجهة لم تصل إلى حالة healthy"
              docker compose logs ${{ env.SERVICE }} --tail 60
              exit 1
            fi

            # نظّف الصور القديمة غير المستخدمة لتوفير المساحة
            docker image prune -f

            docker compose ps
